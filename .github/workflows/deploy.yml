name: Deploy Restro Management

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restro-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build production application
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" <<'EOF'
            set -euo pipefail
            cd /var/www/restroStack
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            sudo systemctl restart restro-management
            sudo systemctl is-active --quiet restro-management || {
              sudo systemctl status restro-management --no-pager -l
              sudo journalctl -u restro-management -n 100 --no-pager
              exit 1
            }
            curl --fail --silent --show-error \
              --retry 15 \
              --retry-connrefused \
              --retry-all-errors \
              --retry-delay 1 \
              --retry-max-time 30 \
              http://127.0.0.1:5000/api/health || {
              sudo systemctl status restro-management --no-pager -l
              sudo journalctl -u restro-management -n 100 --no-pager
              exit 1
            }
          EOF
